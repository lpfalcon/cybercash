swagger: "2.0"
info:
  title: CyberCash Security Gateway
  description: Perimeter shield for Proof of Work validation.
  version: 1.0.0
schemes:
  - https
paths:
  /auth:
    post:
      summary: Unified endpoint for Challenge and Validation
      operationId: handleCybercash
      x-google-backend:
        address: https://cybercash-gateway-319841625898.us-central1.run.app
        path_translation: CONSTANT_ADDRESS
        deadline: 30.0
      responses:
        200:
          description: Access granted. Valid PoW submitted.
        401:
          description: Challenge Required. Returns JSON with challenge and adaptive difficulty.
        403:
          description: Access deny. Invalid challenge or insufficient proof of work.
        429:
          description: Too Many Requests. Rate limit exceeded at Gateway level.

